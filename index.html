<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newty Coffee</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0f1c; color: #e8edf7;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: min(560px, 88vw); }
  h1 { margin: 0 0 28px; font: 600 34px/1.1 Georgia, serif; }
  a.card { display: block; padding: 18px 20px; border-radius: 14px; text-decoration: none; color: inherit;
           background: #131b30; border: 1px solid #2c3a62; transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: #9b6bff; transform: translateY(-1px); }
  a.card b { display: block; font-size: 17px; margin-bottom: 4px;
             background: linear-gradient(90deg, #4f8cff, #9b6bff 45%, #ff5fb4); -webkit-background-clip: text; background-clip: text; color: transparent; }
  a.card span { color: #9aa6c4; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Newty Coffee</h1>
  <a class="card" href="/yue2-microscope/">
    <b>YuE2 microscope</b>
    <span>Watch an open-weight AI music model make a song, from random noise to the finished take, in two interactive 3D views.</span>
  </a>
</main>
</body>
</html>
